services:
  db:
    image: postgres:16-alpine
    container_name: stego_db
    restart: always
    environment:
      POSTGRES_USER: stego_user
      POSTGRES_PASSWORD: stego_password
      POSTGRES_DB: stegoanim_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BACKEND/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stego_user -d stegoanim_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: stego_backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=rahasia-super-aman-ganti-di-produksi
      - ADMIN_SECRET=stego-admin-secret-2026
      - DATABASE_URL=postgresql://stego_user:stego_password@db:5432/stegoanim_db
      - PYTHON_PATH=python3
    ports:
      - "5000:5000"
    volumes:
      - ./BACKEND/uploads:/app/uploads
      - ./BACKEND/outputs:/app/outputs
      - ./BACKEND/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
    container_name: stego_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
